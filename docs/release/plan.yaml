      - id: DEP-AD-1
        requirement: "Massing: the real PLATEAU footprint and height (LOD2 roof where it exists). The mass separates from the pale context by value, not by saturation or glow. In the first-sight frame the facade is at least 20% darker than the sky and context behind it."
        judge: Art director, then Owner
        status: NOT JUDGED
      - id: DEP-AD-2
        requirement: "Facade: pick one of 5 muted swatches (albedo, sRGB), by the real building's dominant facade family. F1 stone beige #B8AD9C, F2 warm grey #9D978F, F3 cool grey #8F969C, F4 dark bronze #4E4740, F5 blue-grey glass #6E7A84 (rough 0.2, environment reflection only). Upper floors use the real type: \"blind\" (most 百貨店: panel joints per floor about 4.5 m, vertical piers every 6–8 m, from geometry or a normal map, no photo texture) or \"glazed\" (a curtain wall, F5, with a spandrel band per floor). Nothing above street level is emissive: in daylight, lit windows read as a sticker."
        judge: Art director, then Owner
        status: NOT JUDGED
      - id: DEP-AD-3
        requirement: "Street band (ground floor, real height, about 4–5 m): a shut, glazed shopfront with bronze mullions every 2.5–3.5 m and a warm glow behind (emissive ≤ 0.5, about #FFD9A8). At most 1.5 m of visible depth. No opening, no dark void, no merchandise or brand content."
        judge: Art director, then Owner
        status: NOT JUDGED
      - id: DEP-AD-4
        requirement: |-
          Sign, the same construction on every store: a slim satin band in warm dark bronze (#3A3029, rough 0.5), with ivory letters (#F2ECE0, emissive 0.6–0.8) in the project sign font at one weight. The ja short name sits on top; the en line is 0.45× its height. The text is the short name in plain text (伊勢丹 本館, 髙島屋, ルミネエスト, ニュウマン, 西武, パルコ, サンシャイン60…), listed in the PR table. Mounting: horizontal, inset in the top-floor band. One sign per face that a station exit sees, at most 2 per building. Never a free-standing rooftop billboard frame.
             Sign size: ja letters no taller than 4 m (Sunshine 60: 6 m). Never inflate a sign to read from far away.
             Every glyph must come from the sign font: no tofu and no fallback face. Check 髙, ュ, and the apostrophe in P'PARCO.
        judge: Art director, then Owner
        status: NOT JUDGED
      - id: DEP-AD-5
        requirement: "Door at each station-side entrance POI: a shut glazed double door in the same bronze, warm light behind it, and a small version of the same sign above it (ja letters 0.25–0.35 m). In a concourse it goes flush on the existing wall, with D15's wall rules: nothing on escalator shafts or platform walls, nothing in the walk line, no corridor depth."
        judge: Art director, then Owner
        status: NOT JUDGED
      - id: DEP-AD-6
        requirement: "Never: a logo, wordmark letterforms (even simplified), a brand colour, a mark or a pattern (tartan, 0101, wrapping paper); magenta or any rail-line colour; a pictogram, an arrow or an exit number. Those belong to wayfinding, and the landmark sign must not look like it."
        judge: Art director, then Owner
        status: NOT JUDGED
      - id: DEP-AD-7
        requirement: "Hierarchy: the station's own signs stay the brightest. In any frame that shows both, the landmark sign's mean luminance is ≤ 0.85× the wayfinding sign's. The landmark sign never covers or crowds an exit sign, the magenta band or the cat. H1–H4 and slice frames do not change in `?next=1` unless I accept the addition."
        judge: Art director, then Owner
        status: NOT JUDGED
      - id: DEP-AD-8
        requirement: "Sunshine 60: from the east exit it is recognised by its silhouette, the clearly tallest slab with a crisp top edge (F3, with the real vertical bay rhythm). The far plane and any distance fade must not cut or wash it out. Its sign follows rule 4 at real scale. It does not need to be readable from 700 m; search carries the name. No floating label: that would be UI, and the UI diet forbids it."
        judge: Art director, then Owner
        status: NOT JUDGED
      - id: DEP-AD-9
        requirement: "Phone budget: at most 3 draw calls per store (facade, street band, sign). Sign text is baked into one mesh or one atlas. No texture above 512² per store."
        judge: Art director, then Owner
        status: NOT JUDGED
      - id: DEP-FRAME-1
        requirement: (a) First sight from the nearest exit at the walk camera, cat at the exit top. The building reads as distinct from the context. The ja name is in frame and not under the UI, with a cap height ≥ 18 px on desktop and ≥ 14 px on phone where the distance allows it under the 4 m cap; otherwise the door frame carries the name.
        judge: Art director, then Owner
        status: NOT JUDGED
      - id: DEP-FRAME-2
        requirement: (b) The station-side door from about 3 m.
        judge: Art director, then Owner
        status: NOT JUDGED
      - id: DEP-FRAME-3
        requirement: (c) The same pose as (a) with the flag off, which must be unchanged.
        judge: Art director, then Owner
        status: NOT JUDGED
      - id: DEP-FRAME-4
        requirement: "Sunshine 60: the east exit frame, with its top in frame."
        judge: Art director, then Owner
        status: NOT JUDGED
      - id: DEP-FRAME-5
        requirement: "Numbers in the PR body: letter-to-band luminance contrast ≥ 3:1, and the sign-to-wayfinding luminance ratio."
        judge: Art director, then Owner
        status: NOT JUDGED

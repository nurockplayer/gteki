      - id: DEP-INTERIOR-2
        requirement: Interiors use the real footprint (PLATEAU building of the phase-1 run; if it is not on main yet, the context building at the store's position) and real floor heights where known, about 4.5 m otherwise.
        judge: Art director, then Owner
        status: NOT JUDGED

        requirement: Walk from the Ikebukuro station concourse through the station-side entrance into 西武's B1 food hall, walk its aisles between counters, take the store's escalator or stairs up to 1F, walk 1F and leave by a street door. The walk works for the player, and search for 西武池袋本店 / デパ地下 routes into it.
        judge: Art director, then Owner

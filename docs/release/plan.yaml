  - id: STATIONS
    title: Reusable station acceptance
    goal: The long-term goal is to reconstruct **Ikebukuro and Shinjuku** as genuinely searchable, reliably navigable, compelling 3D environments, expanding toward validated publicly traversable passages, POIs, exits, levels and access conditions. Both stations have **independent acceptance records**.
    lead: Station leads
    phases:
      - id: L0
        title: Blockout
      - id: L1
        title: Recognizable station
      - id: L2
        title: Polished playable experience (first accepted quality target)
      - id: L3
        title: High-fidelity digital twin (long term)
    current_phase: L2
    open_prs: []
    next_step: Record independent G0–G4 judgements separately for each station; current engineering artifacts remain NOT YET ACCEPTED.
    sources:
      - label: Full station acceptance contract
        url: https://github.com/nurockplayer/gteki/blob/78fa4aec2e0f06317a8596a777fa98310f45dd1d/docs/acceptance.md
    criteria:
      - id: G0
        requirement: |-
          Evidence/rights/safety gate (G0)

          Before interpreting a model as the real station, check actual downloaded resource contents, coverage and licensing. Research metadata/link discovery ≠ geometry read ≠ verified walkable topology ≠ current-world route.

          - No inferred connective edges, shortcut through paid/restricted areas, invented stairs/elevators/levels, or guessed 24-hour access.
          - Facts about ADA/barrier-free accessibility require actual source evidence and continuity; absent data means **UNKNOWN**, not true/false.
          - Government open-data usage requires exact dataset/asset rights, derivative redistribution and attribution checks. Operator graphics and other restricted third-party imagery remain reference-only unless explicitly cleared.
          - If G0 fails for a desired route, produce a **clearly marked synthetic/non-navigational visual prototype**, plus a precise acquisition/survey blocker. Do not greenlight real-user route claims.
        judge: Station lead
        status: NOT JUDGED
        date: null
        evidence: []
        detail_url: https://github.com/nurockplayer/gteki/blob/78fa4aec2e0f06317a8596a777fa98310f45dd1d/docs/acceptance.md
      - id: G1
        requirement: "**G1 Geometry:** checked model-scale, collisions, local coordinates, floor connectors, no clipping/teleport shortcuts, documented fidelity of any approximations."
        judge: Station lead
        status: NOT JUDGED
        date: null
        evidence: []
        detail_url: https://github.com/nurockplayer/gteki/blob/78fa4aec2e0f06317a8596a777fa98310f45dd1d/docs/acceptance.md
      - id: G2
        requirement: "**G2 Routing:** path display matches a verified directed graph, not a visual navmesh guess; route narration and destination correspond to real public access conditions within checked data freshness."
        judge: Station lead
        status: NOT JUDGED
        date: null
        evidence: []
        detail_url: https://github.com/nurockplayer/gteki/blob/78fa4aec2e0f06317a8596a777fa98310f45dd1d/docs/acceptance.md
      - id: G3
        requirement: "**G3 Quality:** actual recorded walk (not a static hero screenshot), recognizable station-specific visual identity, polished lighting/materials/wayfinding, sound/input comfort when appropriate, desktop/phone capture and independent critique. Iteration continues until L2 is credibly met."
        judge: Independent visual/interaction reviewer
        status: NOT JUDGED
        date: null
        evidence: []
        detail_url: https://github.com/nurockplayer/gteki/blob/78fa4aec2e0f06317a8596a777fa98310f45dd1d/docs/acceptance.md
      - id: G4
        requirement: "**G4 Delivery:** reproducible build/tests, PR and reviewed SHA, screenshots/video, sources/rights bundle, per-station coverage report, known limitations and Handoff. Owner approval before merging/releasing and before making real-world navigation guarantees; acceptance of a demo ≠ approval of live travel directions."
        judge: Owner
        status: NOT JUDGED
        date: null
        evidence: []
        detail_url: https://github.com/nurockplayer/gteki/blob/78fa4aec2e0f06317a8596a777fa98310f45dd1d/docs/acceptance.md
  - id: DEPATO
    title: Shinjuku + Ikebukuro department stores and Sunshine City
    goal: every Shinjuku and Ikebukuro department store becomes walkable, first 1F + the basement food hall, eventually every floor.
    lead: gteki-lead; look judged by gteki-visual
    phases:
      - id: exterior
        title: 1. Recognisable exterior
      - id: interior
        title: "2. Walkable B1 food hall + 1F via a generator: Seibu Ikebukuro pilot, then roll-out"
      - id: all-floors
        title: 3. Every floor walkable (end goal)
      - id: floor-data
        title: "Floor data — REVIEW, PR #1509 at the gate; data accepted by lead"
    current_phase: exterior
    open_prs:
      - label: "Shinjuku exterior #1511 (draft)"
        url: https://github.com/nurockplayer/gteki/pull/1511
      - label: "Ikebukuro exterior #1512 (draft)"
        url: https://github.com/nurockplayer/gteki/pull/1512
      - label: "Floor data #1509 (REVIEW)"
        url: https://github.com/nurockplayer/gteki/pull/1509
    next_step: Judge exterior frames; interior pilot is in progress (no PR yet). Prove the generator on Seibu Ikebukuro B1 + 1F, then roll out.
    notes:
      - "Stores (all of them; this is the acceptance list): 伊勢丹新宿店 本館, 伊勢丹新宿店 メンズ館, 小田急百貨店 新宿店 (in 新宿西口ハルク), 京王百貨店 新宿店, 新宿髙島屋 (タカシマヤタイムズスクエア), 新宿マルイ 本館, 新宿マルイ アネックス, ルミネ1, ルミネ2, ルミネエスト新宿, ニュウマン新宿. Stores that sit on or inside the station structure (京王, 小田急/ハルク, ルミネ, ニュウマン) get their sign and entrance on the station-side face and street face rather than a separate building."
      - "Stores (all of them; this is the acceptance list): 西武池袋本店, 東武百貨店 池袋店, ルミネ池袋, エソラ池袋, 池袋パルコ (本館; P'PARCO if it is in the data), and サンシャインシティ (サンシャイン60, 専門店街アルパ, ワールドインポートマート, 文化会館, サンシャインシティプリンスホテル as one landmark group)."
      - "Stores: Shinjuku — 伊勢丹新宿店 本館, 伊勢丹新宿店 メンズ館, 小田急百貨店 新宿店 (新宿西口ハルク, current floors only), 京王百貨店 新宿店, 新宿髙島屋, 新宿マルイ 本館, 新宿マルイ アネックス, ルミネ1, ルミネ2, ルミネエスト新宿, ニュウマン新宿. Ikebukuro — 西武池袋本店, 東武百貨店 池袋店, ルミネ池袋, エソラ池袋, 池袋パルコ, サンシャインシティ (専門店街アルパ, ワールドインポートマート and サンシャイン60 floors open to the public; one store entry per building)."
      - "Source: each store's own official floor guide pages (facts: which floor, what category, which shop names). Record the URL and the read date per floor. Do not copy floor-map images or layouts; names and floor assignments only. A page that blocks or needs JS is a GAP in the PR table; carry on."
      - "Owner request 2026-11-22: every Shinjuku and Ikebukuro department store becomes walkable, first 1F + the basement food hall, eventually every floor. This run builds the system once and proves it on one store; the other stores are rolled out from it afterwards. So build a generator that takes a store (footprint, floor list from the data contract below, entrances) and produces walkable floors, not a hand-placed one-off; it must already accept any number of floors even though only B1 and 1F are enabled now."
      - "Phase 1 = the outside of each store, made recognisable: its real building at its real footprint and height (PLATEAU surface/context data the station already uses, or the source that station already ships), standing out from the generic context blocks (own facade material/colour band, lit windows or shopfront at street level), a name sign with the store name in the project sign font (ja + en), and its existing station-side entrance (the POI already in `pois.json`) showing as a door with the same name. Interiors are NOT part of this task."
      - "Rights: store names and building positions/heights are facts (OD-34 precedent: facts-only OK). Do not copy logos, logo-type lettering, wrapping-paper patterns or facade photos; plain text names only. PLATEAU is CC BY 4.0 and already credited."
      - "Truth: the game shows the present (2026-11). If source geometry predates a demolition or move, use the current state and note it in the PR (e.g. 小田急百貨店 新宿店 operates in 新宿西口ハルク since 2022-10; its old 本館 site is a construction site)."
      - "Ship dark (journey.md rule): everything a visitor sees changes only with `?next=1`; with the flag off nothing visible changes. Search entries may be live without the flag."
      - Each store must be findable in search (existing POI/tenant names) and its search result routes to the store entrance it is attached to.
      - "Sunshine City is about 700 m east of the station, probably beyond the current context radius: extend the context so サンシャイン60 stands on the skyline seen from the east exit (it is the tallest thing there and must read as such), with its name sign. Add a searchable Sunshine City entry that routes to the station exit that leads there and tells the direction (サンシャイン60通り / 東口); a walkable street to the building is not required. If no source we already use covers it, PLATEAU 豊島区 is the source; record the acquisition in docs/gis like the existing context."
      - "Principle: a store is recognised by its real building and its plain name, never by brand dress. These are D15's next-slice rule (real names on original, generic fronts) on real buildings. Provisional until the Owner sees it."
      - "What I judge, per store, desktop 1440×900 and phone 390×844, `?next=1`:"
      - A PR without these frames is not judged.

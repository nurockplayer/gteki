<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GTEki look harness (dev only)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #host { position: fixed; inset: 0; }
      .gteki-canvas { display: block; width: 100%; height: 100%; }

  </head>
  <body>
    <div id="host"></div>
    <pre id="err" hidden></pre>
    <script type="module" src="./look.ts"></script>
  </body>

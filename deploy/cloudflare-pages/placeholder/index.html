<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTEki</title>
  <meta name="description" content="Explore real Japanese stations in 3D. Search, navigate, and walk.">
  <style>
    :root { color-scheme: light dark; --bg: #f6f5f1; --fg: #1d1d1f; --muted: #6b6b70; --accent: #1f6feb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111214; --fg: #ececee; --muted: #9a9aa2; --accent: #58a6ff; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
           background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Hiragino Sans", sans-serif; }
    main { max-width: 560px; }
    h1 { font-size: 2.5rem; margin: 0 0 .25rem; letter-spacing: -.02em; }
    .tag { color: var(--muted); margin: 0 0 1.5rem; }
    a { color: var(--accent); }
    .status { border-left: 3px solid var(--accent); padding: .25rem 0 .25rem 1rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>GTEki</h1>
    <p class="tag">Explore real Japanese stations in 3D. Search, navigate, and walk.</p>
    <p class="status">The browser explorer is in development. This page updates automatically when new work lands on <code>main</code>.</p>
    <p><a href="https://github.com/nurockplayer/gteki">github.com/nurockplayer/gteki</a></p>
  </main>
</body>
</html>

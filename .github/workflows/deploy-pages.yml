name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Manual runs from other branches must not publish to production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://gteki.pages.dev
    steps:
      - uses: actions/checkout@v4

      # Root package.json (once the Web workspace lands) pins pnpm via packageManager;
      # until then fall back to an explicit version.
      - name: Resolve pnpm version
        id: pnpm
        run: |
          if [ -f package.json ]; then echo "version=" >> "$GITHUB_OUTPUT"; else echo "version=10" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build
        run: deploy/cloudflare-pages/build.sh

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm dlx wrangler@4.131.1 pages deploy deploy/cloudflare-pages/dist
          --project-name=gteki
          --branch=main
          --commit-hash=${{ github.sha }}
          --commit-dirty=true

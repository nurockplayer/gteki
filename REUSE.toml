# --- 4g. NO LICENCE GRANT: values scheduled for removal or with no recorded source ------------
# #124: the Owner decided to remove no-release values from the current tree (git history is not
# rewritten). Until GIS PR #128 lands, these files embed S10/S03/KSJ/PLATEAU-related literal values
# and must not receive any repository licence. Tokyo S10 and S03 are CC BY 4.0 at dataset level and

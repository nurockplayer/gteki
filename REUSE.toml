# --- 4h. docs/visual/evidence: project-made screenshots (director decision via GIS) ------------
# Project-made screenshots are CC-BY-4.0 (repo licence). The ones that show Ikebukuro PLATEAU ubld
# 53394576-derived geometry also carry the PLATEAU credit

# REUSE configuration (https://reuse.software, REUSE spec 3.x REUSE.toml).
#
# Owner licensing decision, Issue #123 (2026-10-22):
#   - Code and repo default ............... Apache-2.0
#   - Original project art (Lane E assets) . CC-BY-4.0, credit "GTEki contributors"
#   - AI-generated 2D images .............. CC0-1.0 (provenance sidecar kept, labelled AI-generated)
#   - Third-party data and derived files .. keep their own terms; listed in NOTICE; never relicensed
#
# Rule used here: every annotation uses precedence = "override" and a LATER
# annotation wins over an EARLIER one for the same path. So the order is:
# default first, then original art, then AI images, then the third-party block.
# Hard rule: nothing third-party may resolve to Apache-2.0, CC-BY-4.0 or CC0-1.0.
# Licence texts live in LICENSES/ (LicenseRef-* files are pointers, not texts).

version = 1

# --- 1. Default: code, docs text, configs --------------------------------------------------

[[annotations]]
path = "**"
precedence = "override"
SPDX-FileCopyrightText = "GTEki contributors"
SPDX-License-Identifier = "Apache-2.0"

# --- 2. Original project art: CC-BY-4.0 ----------------------------------------------------
# Lane E procedural assets: Blender-built GLBs (full + mobile), textures embedded in them,
# manifests, the library provenance note, plus the contact sheets and renders in docs/assets/img.
# assets/library/** includes the provenance sidecar and manifests; the AI posters are carved
# out in section 3 below.

# Byte-for-byte copies of kit GLBs that a station bundles (the explorer refuses symlinks into assets/library):
# stations/ikebukuro/gteki/kit/{high,low}/ (pipeline/sync_kit.py). They live beside, not under,
# stations/ikebukuro/gteki/assets/, so the PLATEAU annotation in section 4a (which globs that folder) does not
# touch them. The GLBs' embedded licence strings read UNDECIDED until the kit's EMBED_SPDX rebuild; this is the record.
[[annotations]]
path = ["assets/library/**", "docs/assets/img/**", "stations/*/gteki/kit/**"]
precedence = "override"
SPDX-FileCopyrightText = "GTEki contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# #94 look-gap captures: renders of the Lane E kit (showcase layouts) in the web explorer.
[[annotations]]
path = "docs/qa/reports/2026-10-22-art-94/*.jpg"
precedence = "override"
SPDX-FileCopyrightText = "GTEki contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# --- 3. AI-generated 2D images: CC0-1.0 ----------------------------------------------------
# Generated 2026-10-20 with OpenAI image generation through Codex; prompts, hashes and the
# "AI-generated" label are in assets/library/source/posters/provenance.json. Fictional only:
# no real brands, logos, trademarks, people or places.

[[annotations]]
path = "assets/library/source/posters/*.jpg"
precedence = "override"
SPDX-FileCopyrightText = "GTEki contributors (AI-generated image, dedicated to the public domain)"
SPDX-License-Identifier = "CC0-1.0"

# Art batch 1 (2026-10-22): 31 Owner-approved AI images, their provenance.json and catalog.json,
# and the contact sheet that shows only those images. Placed after the section 2 CC-BY block so it
# overrides assets/library/** and docs/assets/img/** (last matching annotation wins).
# Fictional brands only; the text layer is typeset afterwards in Noto Sans JP (SIL OFL 1.1; the
# font is not committed). The JPEGs are the source of record.
[[annotations]]
path = ["assets/library/source/art2d/**", "docs/assets/img/art2d_batch1.jpg"]
precedence = "override"
SPDX-FileCopyrightText = "GTEki contributors (AI-generated; see provenance.json)"
SPDX-License-Identifier = "CC0-1.0"

# =============================================================================================
# 4. THIRD-PARTY: draft for GIS review (Lane D owns the final entries and the path mapping)
# =============================================================================================
# Source: GIS inventory for Issue #123, Part A (paths) and Part B (credits), against main f8ce063.
# Every entry keeps the source's own terms and is NOT relicensed by GTEki. These annotations
# label provenance so that `reuse lint` sees an identifier; they grant nothing, and none of them
# uses Apache-2.0, CC-BY-4.0 or CC0-1.0 (hard rule), even where the upstream record says CC BY 4.0
# (Deliberate exception, director decision: project-made screenshots in 4h carry CC-BY-4.0 AND the
# third-party id for the content they show; the third-party content itself is not relicensed.)
# GTEki-authored records that stay at the Apache-2.0 default (acquisition receipts, conversion and
# context receipts, rights assessments, tools/gis/sources, shinjuku sources/manifest.json) describe
# third-party sources; they do not relicense them.
# The LicenseRef files in LICENSES/ are pointers (URL + recorded snapshot sha256), not texts.
# The SPDX-FileCopyrightText values name the PUBLISHER as the repo records it, not a copyright
# holder (GIS open item 11); "modified by GTEki contributors" is added where the data was modified.
# GIS re-ran the list for PRs #110, #115, #117, #127 and #61 (Issue #161).

# --- 4fonts. Noto Sans JP, pinned Sans2.004; modified subset under our own alias ------------
[[annotations]]
path = ["assets/fonts/**", "apps/web/src/fonts/**"]
precedence = "override"
